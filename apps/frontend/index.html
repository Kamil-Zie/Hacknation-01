<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kropelka – sprawdź wodę na swojej działce</title>
    <meta
      name="description"
      content="Kropelka pokazuje rolnikowi, czy jego działce brakuje wody: bilans wodny, zdjęcia satelitarne i zalecenia na podstawie otwartych danych."
    />
    <meta name="theme-color" content="#357A1F" />
    <meta property="og:title" content="Kropelka – sprawdź wodę na swojej działce" />
    <meta
      property="og:description"
      content="Kropelka pokazuje rolnikowi, czy jego działce brakuje wody: bilans wodny, zdjęcia satelitarne i zalecenia na podstawie otwartych danych."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* T-099 first paint in dark mode before React renders (high contrast wins, it paints black itself) */
      html.dark:not(.high-contrast),
      html.dark:not(.high-contrast) body {
        background-color: #121a23;
        color-scheme: dark;
      }
      html.high-contrast,
      html.high-contrast body {
        background-color: #000;
      }
    </style>
    <script>
      // T-084 apply saved text size and contrast before the first render (keys: src/store/a11y.ts)
      (function () {
        try {
          var html = document.documentElement;
          var size = window.localStorage.getItem('kropelka-text-size');
          var sizes = { 1: '112.5%', 2: '125%' };
          if (sizes[size]) {
            html.style.fontSize = sizes[size];
            html.dataset.textSize = size;
          }
          var contrast = window.localStorage.getItem('kropelka-contrast');
          var systemHigh =
            window.matchMedia && window.matchMedia('(prefers-contrast: more)').matches;
          if (contrast === 'high' || (contrast === null && systemHigh)) {
            html.classList.add('high-contrast');
          }
          // T-099 dark mode: saved choice, otherwise the system setting
          var dark = window.localStorage.getItem('kropelka-dark');
          var systemDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark === 'dark' || (dark === null && systemDark)) {
            html.classList.add('dark');
          }
        } catch (e) {
          // no storage access: defaults
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
