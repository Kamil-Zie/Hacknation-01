# T-065 Prod on Synology (docs/deploy.md): ports only on 127.0.0.1, Cloudflare Tunnel in front
name: hacknation
services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: https://api.kamil-zielinski.pl/api/v1
    image: hacknation-frontend:latest
    restart: unless-stopped
    ports: ['127.0.0.1:18080:80']
    networks: [hacknation]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: hacknation-backend:latest
    restart: unless-stopped
    env_file: .env.prod
    ports: ['127.0.0.1:13000:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [hacknation]

networks:
  hacknation:
