# T-065 Prod images: scan the repo for secrets, build backend + frontend for amd64 and arm64, push to GHCR.
# The Synology NAS only pulls them (deploy/docker-compose.yml), no npm on the NAS.
name: images

on:
  push:
    branches: [main]
    paths:
      [
        'apps/**',
        'database/**',
        'contracts/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/images.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret scan (files + whole history)
        run: |
          node .claude/scripts/git-checks.mjs scan --all
          node .claude/scripts/git-checks.mjs scan --history

  build:
    needs: scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kamil-zie/hacknation-${{ matrix.app }}:latest
            ghcr.io/kamil-zie/hacknation-${{ matrix.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
