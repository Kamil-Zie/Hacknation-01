# T-065 Prod on Synology (docs/deploy.md). Put this file, Dockerfile.backend, Dockerfile.frontend and .env.prod
# in /volume1/docker/hacknation. The Dockerfiles clone the public repo and scan it before building.
# Deploy and every update:  docker compose up -d --build
name: hacknation

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: https://api.kamil-zielinski.pl/api/v1
    image: hacknation-frontend:latest
    restart: unless-stopped
    # only on localhost: Cloudflare Tunnel (host network) -> localhost:18080 = app.kamil-zielinski.pl
    ports: ['127.0.0.1:18080:80']
    networks: [hacknation]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: hacknation-backend:latest
    restart: unless-stopped
    env_file: ./.env.prod
    # only on localhost: Cloudflare Tunnel (host network) -> localhost:13000 = api.kamil-zielinski.pl
    ports: ['127.0.0.1:13000:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [hacknation]

networks:
  hacknation:
