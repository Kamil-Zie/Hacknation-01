# T-065 Prod on Synology (Container Manager → Project). Images are built and secret-scanned in GitHub Actions
# (.github/workflows/images.yml) and only pulled here: no npm, no build on the NAS.
# Project folder: /volume1/docker/hacknation with this file and .env.prod (template: deploy/env.prod.example).
# Update after a new commit on main: Container Manager → Project → hacknation → Action → Build (pulls :latest again).
name: hacknation

services:
  frontend:
    image: ghcr.io/kamil-zie/hacknation-frontend:latest
    pull_policy: always
    restart: unless-stopped
    # only on localhost: Cloudflare Tunnel (host network) -> localhost:18080 = app.kamil-zielinski.pl
    ports: ['127.0.0.1:18080:80']
    networks: [hacknation]

  backend:
    image: ghcr.io/kamil-zie/hacknation-backend:latest
    pull_policy: always
    restart: unless-stopped
    env_file: ./.env.prod
    # only on localhost: Cloudflare Tunnel (host network) -> localhost:13000 = api.kamil-zielinski.pl
    ports: ['127.0.0.1:13000:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [hacknation]

networks:
  hacknation:
