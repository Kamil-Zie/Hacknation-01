# T-065 Prod on Synology: the Dockerfiles pull the public repo themselves, scan it for secrets, then build (docs/deploy.md)
# On the NAS you need only this file (as docker-compose.yml) and .env.prod (backend secrets, chmod 600) next to it.
#
# Deploy and every update (a new commit on main busts the cache; a secret found by the scan stops the build):
#   docker compose up -d --build
name: hacknation

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: https://api.kamil-zielinski.pl/api/v1
      dockerfile_inline: |
        # Stage "source": clone main and scan all files + the whole history (git-checks.mjs)
        FROM node:22-alpine AS source
        RUN apk add --no-cache git
        # changes whenever main gets a new commit, so the clone below is never served from cache
        ADD https://api.github.com/repos/Kamil-Zie/Hacknation-01/commits/main /tmp/main.json
        RUN git clone --branch main https://github.com/Kamil-Zie/Hacknation-01.git /src \
         && cd /src \
         && echo "[source] main = $$(git log --oneline -1)" \
         && node .claude/scripts/git-checks.mjs scan --all \
         && node .claude/scripts/git-checks.mjs scan --history

        FROM node:22-alpine AS build
        WORKDIR /app
        COPY --from=source /src/package.json /src/package-lock.json ./
        COPY --from=source /src/apps/backend/package.json apps/backend/
        COPY --from=source /src/apps/frontend/package.json apps/frontend/
        COPY --from=source /src/database/package.json database/
        RUN npm ci --ignore-scripts
        COPY --from=source /src/contracts contracts
        COPY --from=source /src/apps/frontend apps/frontend
        ARG VITE_API_URL
        ENV VITE_API_URL=$$VITE_API_URL VITE_USE_MOCKS=false
        RUN npm run build -w apps/frontend

        FROM nginx:1.27-alpine
        COPY --from=source /src/apps/frontend/nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=build /app/apps/frontend/dist /usr/share/nginx/html
        EXPOSE 80
    image: hacknation-frontend:latest
    restart: unless-stopped
    ports: ['127.0.0.1:18080:80']
    networks: [hacknation]

  backend:
    build:
      context: .
      dockerfile_inline: |
        # Stage "source": clone main and scan all files + the whole history (git-checks.mjs)
        FROM node:22-alpine AS source
        RUN apk add --no-cache git
        # changes whenever main gets a new commit, so the clone below is never served from cache
        ADD https://api.github.com/repos/Kamil-Zie/Hacknation-01/commits/main /tmp/main.json
        RUN git clone --branch main https://github.com/Kamil-Zie/Hacknation-01.git /src \
         && cd /src \
         && echo "[source] main = $$(git log --oneline -1)" \
         && node .claude/scripts/git-checks.mjs scan --all \
         && node .claude/scripts/git-checks.mjs scan --history

        FROM node:22-alpine AS build
        WORKDIR /app
        COPY --from=source /src/package.json /src/package-lock.json ./
        COPY --from=source /src/apps/backend/package.json apps/backend/
        COPY --from=source /src/apps/frontend/package.json apps/frontend/
        COPY --from=source /src/database/package.json database/
        RUN npm ci --ignore-scripts
        COPY --from=source /src/apps/backend apps/backend
        RUN npm run build -w apps/backend

        FROM node:22-alpine
        ENV NODE_ENV=production
        WORKDIR /app
        COPY --from=source /src/package.json /src/package-lock.json ./
        COPY --from=source /src/apps/backend/package.json apps/backend/
        COPY --from=source /src/apps/frontend/package.json apps/frontend/
        COPY --from=source /src/database/package.json database/
        RUN npm ci --omit=dev --ignore-scripts -w apps/backend && npm cache clean --force
        COPY --from=build /app/apps/backend/dist apps/backend/dist
        WORKDIR /app/apps/backend
        USER node
        EXPOSE 3000
        CMD ["node", "dist/server.js"]
    image: hacknation-backend:latest
    restart: unless-stopped
    env_file: ./.env.prod
    ports: ['127.0.0.1:13000:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [hacknation]

networks:
  hacknation:
